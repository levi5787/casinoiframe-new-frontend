<div class="sidebar left-sidebar">
  <div class="accordion">
    <div class="accordion-item">
      <h2 class="sidebar-title accordion-header">
        <button type="button" [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()" class="accordion-button"
          [class.collapsed]="!isMenuOpen">Menu</button>
      </h2>
      <div class="accordion-collapse collapse" [class.show]="isMenuOpen">
        <div class="other-casino-list accordion-body">
          <ul>
            <li class="nav-item"><a class="nav-link" [routerLink]="['/casino/lobby', token]"><span>Casino Games</span></a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
