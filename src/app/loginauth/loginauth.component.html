<div id="root">
  <div style="position: fixed; z-index: 9999; inset: 16px; pointer-events: none;"></div>
  <div class="wrapper">
    <div class="login-page">
      <div class="login-box login-auth-box">
        <div class="logo-login">
          <img src="/img/logo.png">
        </div>
        <div class="login-form mt-4 login-auth">
          <h4 class="text-center login-title">Security Code Verification Using Telegram App</h4>
          <p>Enter 6-digit code from your telegram bot<a class="ms-2 pointer">Resend Code</a></p>
          <div style="display: flex;">
            <div style="display: flex; align-items: center;">
              <input #txt1 aria-label="Please enter verification code. Digit 1" autocomplete="off" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt1"  (keyup)="move($event,'',txt1,txt2)" [(ngModel)]="pin[0]" autofocus>
            </div>
            <div style="display: flex; align-items: center;">
              <input #txt2 aria-label="Digit 2" autocomplete="off" pattern="[0-9]" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt2" (keyup)="move($event,txt1,txt2,txt3)" [(ngModel)]="pin[1]">
            </div>
            <div style="display: flex; align-items: center;">
              <input #txt3 aria-label="Digit 3" autocomplete="off" pattern="[0-9]" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt3" (keyup)="move($event,txt2,txt3,txt4)" [(ngModel)]="pin[2]">
            </div>
            <div style="display: flex; align-items: center;">
              <input #txt4 aria-label="Digit 4" autocomplete="off" pattern="[0-9]" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt4" (keyup)="move($event,txt3,txt4,txt5)" [(ngModel)]="pin[3]">
            </div>
            <div style="display: flex; align-items: center;">
              <input #txt5 aria-label="Digit 5" autocomplete="off" pattern="[0-9]" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt5" (keyup)="move($event,txt4,txt5,txt6)" [(ngModel)]="pin[4]">
            </div>
            <div style="display: flex; align-items: center;">
              <input #txt6 aria-label="Digit 6" autocomplete="off" pattern="[0-9]" type="tel" maxlength="1"
                style="width: 1em; text-align: center;" name="txt6" (keyup)="move($event,txt5,txt6,'')" [(ngModel)]="pin[5]">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
