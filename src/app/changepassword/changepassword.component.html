<div id="root">
  <div style="/* position: fixed; *//* z-index: 9999; *//* inset: 16px; *//* pointer-events: none; */"></div>
  <div class="wrapper">

    <div class="login-page">
      <div class="login-box">
        <div class="logo-login"><img src="/img/logo.png"></div>

        <div class="login-form mt-4">
          <h4 class="text-center login-title">LOGIN <i class="fas fa-hand-point-down"></i></h4>
          <form #changepassform="ngForm" (ngSubmit)="changepass(changepassform.value)" class="login-chage-pass"
            data-gtm-form-interact-id="2">
            <div class="row row10">
              <div class="mb-3 position-relative">
                <label class="form-label text-start w-100">CurrentPassword:</label>
                <input (focus)="clearErr('current_password')" name="current_password" type="password"
                  class="form-control" placeholder="Enter Current password" data-gtm-form-interact-field-id="4" ngModel>
                <p *ngIf="requirederr.current_password" class="error-form"> {{ requirederr.current_password }} </p>
              </div>
            </div>
            <div class="row row10">
              <div class="mb-3 position-relative">
                <label class="form-label text-start w-100">New Password:</label>
                <input (focus)="clearErr('new_password')" name="new_password" type="password" class="form-control"
                  placeholder="Enter New Password" ngModel>
                <p *ngIf="requirederr.new_password" class="error-form"> {{ requirederr.new_password }} </p>
              </div>

            </div>
            <div class="row row10">
              <div class="mb-4 position-relative">
                <label class="form-label text-start w-100">Confirm Password:</label>
                <input (focus)="clearErr('confirm_password')" name="confirm_password" type="password"
                  class="form-control" placeholder="Confirm New Password" ngModel>
                <p *ngIf="requirederr.confirm_password" class="error-form"> {{ requirederr.confirm_password }} </p>
              </div>
            </div>
            <div class="row row10">
              <div class="mb-3"><button type="submit" class="btn btn-primary btn-block">Change Password</button></div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
