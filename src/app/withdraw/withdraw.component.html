<div id="root">
  <div
    style="position: fixed; z-index: 9999; inset: 16px; pointer-events: none"
  ></div>
  <div class="wrapper">
    <app-header></app-header>
    <div class="main-container">
      <div class="sidebar left-sidebar">
        <app-sidebar></app-sidebar>
      </div>
      <div class="col-md-10 featured-box">
        <div class="card">
          <div class="card-header">
            <h4 class="mb-0">Withdraw</h4>
          </div>
          <div class="card-body container-fluid container-fluid-5">
            <form
              #withdrawForm="ngForm"
              (submit)="withdrawSubmit(withdrawForm.value)"
            >
              <!-- add detail -->
              <div class="add-new-detail-container">
                <div class="deposit-options report-form">
                  <div class="form-group pr mb-4">
                    <label>Amount</label>
                    <input
                      type="text"
                      (keydown)="checkAmount()"
                      maxlength="8"
                      placeholder="Amount"
                      name="amount"
                      class="form-control"
                      [(ngModel)]="amount"
                    />
                  </div>
                  <div class="form-group pr mb-4">
                    <label>Type</label>
                    <select class="form-control" name="withdraw_type">
                      <option value="1">NORMAL</option>
                    </select>
                  </div>
                  <div class="form-group pr mb-4">
                    <label class="d-md-block d-none">&nbsp;</label>
                    <button type="submit" class="btn btn-danger">
                      <span>Submit</span>
                    </button>
                  </div>
                </div>
                <span *ngIf="amountErr" class="error">{{ amountErr }}</span>
              </div>
              <!-- added details -->
              <div class="add-new-detail">
                <div class="payment-icons-title">
                  <div>
                    <h3>BANK TRANSFER</h3>
                    <p></p>
                  </div>
                  <div (click)="open(addnew)" class="btn btn-primary">
                    Add New
                  </div>
                </div>
                <div class="account-detail">
                  <div class="form-check" *ngFor="let item of banks">
                    <input
                      type="radio"
                      name="bankId"
                      [value]="item._id"
                      class="form-check-input"
                      [(ngModel)]="selectedBank"
                    />
                    <label for="radio" class="form-check-label">
                      <div class="account-detail-box">
                        <div>
                          <div class="payment-detail-box">
                            <span>PAYMENT METHOD: </span>
                            <span>{{ item.payment_method }}</span>
                          </div>
                          <div
                            class="payment-detail-box"
                            *ngIf="item.bank_name"
                          >
                            <span>BANK NAME: </span>
                            <span>{{ item.bank_name }}</span>
                          </div>
                          <div
                            class="payment-detail-box"
                            *ngIf="item.account_name"
                          >
                            <span>ACCOUNT HOLDER NAME: </span>
                            <span>{{ item.account_name }}</span>
                          </div>
                          <div class="payment-detail-box">
                            <span>ACCOUNT NUMBER / ID: </span>
                            <span>{{ item.account_number }}</span>
                          </div>
                          <div
                            class="payment-detail-box"
                            *ngIf="item.ifsc_code"
                          >
                            <span>IFSC CODE: </span>
                            <span>{{ item.ifsc_code }}</span>
                          </div>
                        </div>
                        <div>
                          <div class="payment-detail-box" *ngIf="item.file">
                            <img
                              (click)="openSS(openss, item.file)"
                              width="110px"
                              height="110px"
                              class="uploaded-ss"
                              [src]="baseURL + item.file"
                            />

                            <i
                              (click)="deleteBank(item._id)"
                              class="fas fa-trash-alt delete delete-icon"
                            ></i>
                          </div>
                        </div>
                      </div>
                    </label>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-footer></app-footer>
</div>

<ng-template #addnew let-c="close" let-d="dismiss">
  <div role="document" class="modal-lg">
    <div class="modal-header">
      <h5 class="modal-title">Add New Detail</h5>
      <button type="button" class="close" (click)="d('Cross click')">X</button>
    </div>
    <div class="modal-body">
      <form
        #bankForm="ngForm"
        ngNativeValidate
        (submit)="addBank(bankForm.value, qrFile, bankForm)"
      >
        <div class="form-group">
          <label for="bank_name">PAYMENT METHOD</label>
          <select
            class="form-control"
            id="payment_method"
            name="payment_method"
            [(ngModel)]="payment_method"
          >
            <option value="Bank Transfer" value="Bank Transfer">
              Bank Transfer
            </option>
            <option value="UPI">UPI</option>
            <option value="Phonepay">Phonepay</option>
            <option value="GPay">Gpay</option>
            <option value="Paytm">Paytm</option>
          </select>
        </div>
        <div class="form-group" *ngIf="payment_method == 'Bank Transfer'">
          <label for="bank_name">BANK NAME</label>
          <input
            id="bank_name"
            name="bank_name"
            type="text"
            placeholder="Enter bank name"
            class="form-control"
            ngModel
          />
        </div>
        <div class="form-group" *ngIf="payment_method == 'Bank Transfer'">
          <label for="account_name">ACCOUNT NAME</label>
          <input
            id="account_name"
            name="account_name"
            type="text"
            placeholder="Enter account holder name"
            class="form-control"
            ngModel
          />
        </div>
        <div class="form-group">
          <label for="account_number">ACCOUNT NUMBER / ID</label>
          <input
            id="account_number"
            name="account_number"
            type="text"
            placeholder="Enter account number / UPI ID"
            class="form-control"
            required
            ngModel
          />
        </div>
        <div class="form-group" *ngIf="payment_method == 'Bank Transfer'">
          <label for="ifsc_code">IFSC CODE</label>
          <input
            id="ifsc_code"
            name="ifsc_code"
            type="text"
            placeholder="Enter IFSC code"
            class="form-control"
            ngModel
          />
        </div>
        <div class="form-group">
          <label for="accountType">QR</label>
          <input
            type="file"
            class="form-control"
            id="qr"
            name="qr"
            accept="image/png, image/jpg, image/jpeg"
            #qrFile
          />
        </div>
        <div class="form-group">
          <label for="other_info">OTHER INFO</label>
          <input
            id="other_info"
            name="other_info"
            type="text"
            placeholder="Any other information (optional)"
            class="form-control"
            ngModel
          />
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
  </div>
</ng-template>

<ng-template #openss let-c="close" let-d="dismiss">
  <div role="document" class="modal-lg">
    <div class="modal-header">
      <h5 class="modal-title">Screenshot</h5>
      <button type="button" class="close" (click)="d('Cross click')">X</button>
    </div>
    <div class="modal-body">
      <img class="uploaded-ss" width="100%" [src]="baseURL + selectedImage" />
    </div>
  </div>
</ng-template>
