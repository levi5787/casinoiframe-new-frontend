<header class="app-header">
  <nav class="app-navbar">
    <a class="nav-home" [routerLink]="['/casino/lobby', token]" title="Lobby" aria-label="Go to lobby">
      <i class="fas fa-home"></i>
    </a>
    <div class="nav-right">
      <div class="nav-stats">
        <div class="nav-stat">
          <span class="stat-label"><span class="label-full">Balance</span><span class="label-short">Bal</span>:</span>
          <b class="stat-value">{{ twoDecimal(balance) }}</b>
        </div>
        <div class="nav-stat pointer" (click)="openMarket(my_market)">
          <span class="stat-label"><span class="label-full">Exposure</span><span class="label-short">Exp</span>:</span>
          <b class="stat-value">{{ exposure || 0 }}</b>
        </div>
      </div>
      <div class="nav-user" [title]="username">
        <i class="fas fa-user"></i>
        <span class="user-text">{{ username }}</span>
      </div>
    </div>
  </nav>
</header>

<ng-template #my_market let-c="close" let-d="dismiss">
  <div role="document">
    <div class="modal-header">
      <div class="modal-title h4">My Market</div>
      <button
        type="button"
        class="btn-close"
        (click)="d('Cross click')"
      ></button>
    </div>
    <div class="modal-body">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Event Type</th>
              <th>Event Name</th>
              <th>Match Name</th>
              <th>Trade</th>
            </tr>
          </thead>
          <tbody>
            <!-- <tr>
              <td>Cricket</td>
              <td><a href="/game-details/4/721913741">Zimbabwe v South Africa</a></td>
              <td>MATCH_ODDS</td>
              <td>1</td>
            </tr> -->
            <tr *ngFor="let item of myMarket">
              <td>{{ item.sportName }}</td>
              <td>
                <a
                  style="cursor: pointer"
                  class="sportlink"
                  (click)="
                    getlink(
                      item.sportName,
                      item.sportId,
                      item.mType,
                      item.eventId
                    )
                  "
                >
                  {{ item.eventName }}
                </a>
                <!-- <a style="cursor: pointer;" class="sportlink" routerLink="/game-details/{{item.sportId}}/{{item.eventId}}">
                  {{item.eventName}}
                </a> -->
              </td>
              <td>{{ item.oddsType }}</td>
              <td>{{ item.trade }}</td>
            </tr>
            <tr *ngIf="myMarket.length == 0">
              <td colspan="4" class="text-center">
                No real-time records found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-template>
