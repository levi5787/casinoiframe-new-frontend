<div id="root">
  <div style="position: fixed; z-index: 9999; inset: 16px; pointer-events: none;"></div>
  <div class="wrapper">
    <app-header></app-header>
    <div class="main-container">
      <div class="sidebar left-sidebar">
        <app-sidebar></app-sidebar>
      </div>
      <div class="center-main-container home-page">
        <div class="center-container">
          <div class="int-play-frame">
            <div class="int-play-loader-overlay" *ngIf="isLoading">
              <div class="int-play-loader-spinner"></div>
              <div class="int-play-loader-text">Loading game…</div>
            </div>
            <div class="int-play-error" *ngIf="errorText && !isLoading">{{ errorText }}</div>
            <iframe *ngIf="iframeURL" [src]="iframeURL" width="100%" height="710px" frameborder="0" allowfullscreen
              (load)="onIframeLoad()"> </iframe>
          </div>
        </div>
      </div>

    </div>
    <app-footer></app-footer>
  </div>
</div>
